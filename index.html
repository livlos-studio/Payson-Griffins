<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maylett's Griffins · Game Day Rotations</title>
<style>
  :root {
    --orange: #E8650A;
    --orange-light: rgba(232,101,10,0.15);
    --orange-mid: #F5A46B;
    --orange-dark: #B34D06;
    --bg: #000000;
    --surface: #161616;
    --surface2: #2A2A2A;
    --border: #333333;
    --border2: #444444;
    --text: #F0EDE8;
    --text-2: #A09A93;
    --text-3: #666660;
    --radius: 10px;
    --shadow: 0 1px 4px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .header {
    background: #0D0D0D;
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon {
    width: 40px; height: 40px;
    background: var(--orange);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
  .header p { font-size: 12px; color: var(--text-2); margin-top: 2px; }

  .screen { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
  .screen.active { display: block; }

  .screen-heading { padding: 14px 0 10px; }
  .screen-heading p:first-child { font-size: 15px; font-weight: 700; color: var(--text); }
  .screen-heading p:last-child { font-size: 13px; color: var(--text-2); margin-top: 3px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--text-3); margin-bottom: 12px;
  }

  /* PLAYER GRID */
  .player-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .player-tile {
    display: flex; align-items: center; gap: 10px;
    padding: 12px; border: 1.5px solid var(--border2);
    border-radius: 8px; cursor: pointer; background: var(--surface2);
    transition: border-color .12s, background .12s;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .player-tile.selected { border-color: var(--orange); background: var(--orange-light); }
  .check-box {
    width: 20px; height: 20px; border: 2px solid var(--border2);
    border-radius: 5px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface); transition: background .12s, border-color .12s;
  }
  .player-tile.selected .check-box { background: var(--orange); border-color: var(--orange); }
  .checkmark {
    display: none; width: 5px; height: 9px;
    border-right: 2px solid #fff; border-bottom: 2px solid #fff;
    transform: rotate(45deg) translate(-1px,-1px);
  }
  .player-tile.selected .checkmark { display: block; }
  .player-name { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
  .player-tile.selected .player-name { color: var(--orange-mid); }
  .star-badge { font-size: 14px; opacity: 0.6; }
  .player-tile.selected .star-badge { opacity: 1; }

  .select-all-row {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 12px;
  }
  .select-all-row span { font-size: 12px; color: var(--text-3); }
  .link-btn {
    background: none; border: none; cursor: pointer;
    font-size: 13px; color: var(--orange); font-weight: 700; padding: 4px 0;
    touch-action: manipulation;
  }

  /* GOALIE GRID */
  .goalie-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .goalie-btn {
    padding: 10px 4px; border: 1.5px solid var(--border2);
    border-radius: 8px; background: var(--surface2); cursor: pointer;
    text-align: center; font-size: 13px; font-weight: 700; color: var(--text-2);
    transition: all .12s; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .goalie-btn.selected { border-color: var(--orange); background: var(--orange-light); color: var(--orange-mid); }

  /* SHIFT LENGTH SELECTOR */
  .shift-selector {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 4px;
  }
  .shift-opt {
    padding: 10px 4px;
    border: 1.5px solid var(--border2);
    border-radius: 8px;
    background: var(--surface2);
    cursor: pointer;
    text-align: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: all .12s;
  }
  .shift-opt.selected {
    border-color: var(--orange);
    background: var(--orange-light);
  }
  .shift-opt-min {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    display: block;
  }
  .shift-opt.selected .shift-opt-min { color: var(--orange-mid); }
  .shift-opt-lbl {
    font-size: 10px;
    color: var(--text-3);
    display: block;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .shift-opt.selected .shift-opt-lbl { color: var(--orange-dark); }
  .shift-preview {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.6;
  }
  .shift-preview strong { color: var(--text); }

  /* BUTTONS */
  .btn-primary {
    width: 100%; padding: 15px; background: var(--orange); color: #fff;
    border: none; border-radius: var(--radius); font-size: 15px;
    font-weight: 700; cursor: pointer; letter-spacing: .2px;
    transition: background .12s; touch-action: manipulation;
  }
  .btn-primary:active { background: var(--orange-dark); }
  .btn-primary:disabled { background: var(--surface2); color: var(--text-3); cursor: not-allowed; border: 1px solid var(--border); }
  .btn-secondary {
    padding: 12px 18px; background: var(--surface2); color: var(--text);
    border: 1.5px solid var(--border2); border-radius: var(--radius);
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .12s; touch-action: manipulation;
  }
  .btn-secondary:active { background: var(--border); }

  /* SUMMARY BAR */
  .summary-bar {
    background: var(--orange); border-radius: var(--radius);
    padding: 14px 16px; display: flex; gap: 0; margin-bottom: 14px;
  }
  .sbar-item { text-align: center; flex: 1; }
  .sbar-item + .sbar-item { border-left: 1px solid rgba(255,255,255,0.25); }
  .sbar-val { font-size: 22px; font-weight: 800; color: #fff; }
  .sbar-lbl { font-size: 10px; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

  /* SHIFT CARDS */
  .shift-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 10px;
  }
  .shift-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .shift-num {
    width: 30px; height: 30px; background: var(--orange); color: #fff;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; flex-shrink: 0;
  }
  .shift-meta { flex: 1; }
  .shift-label { font-size: 13px; font-weight: 700; color: var(--text); }
  .shift-time { font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .half-badge {
    font-size: 10px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; padding: 3px 9px; border-radius: 999px;
    background: rgba(232,101,10,0.2); color: var(--orange-mid);
    border: 1px solid rgba(232,101,10,0.3);
  }
  .shift-body { padding: 10px 14px; }
  .field-row {
    display: flex; align-items: center; gap: 7px;
    flex-wrap: wrap; margin-bottom: 7px;
  }
  .field-row:last-child { margin-bottom: 0; }
  .field-label {
    font-size: 11px; font-weight: 700; color: var(--text-3);
    min-width: 38px; text-transform: uppercase; letter-spacing: .04em;
  }
  .player-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px; font-size: 13px;
    font-weight: 600; border: 1px solid var(--border2);
    background: var(--surface2); color: var(--text);
  }
  .player-pill.gk-pill {
    background: rgba(232,101,10,0.18); border-color: rgba(232,101,10,0.5);
    color: var(--orange-mid); font-weight: 700;
  }
  .player-pill.oliver-pill {
    border-color: rgba(255,210,100,0.5); background: rgba(255,210,100,0.1);
    color: #FFD264; font-weight: 700;
  }

  .halftime-bar {
    display: flex; align-items: center; gap: 10px; margin: 14px 0;
  }
  .halftime-bar::before, .halftime-bar::after {
    content: ''; flex: 1; height: 1px; background: var(--border2);
  }
  .halftime-label {
    font-size: 11px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-3);
  }

  /* TOTALS */
  .totals-table { width: 100%; border-collapse: collapse; }
  .totals-table th {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .05em; color: var(--text-3); padding: 0 0 10px;
    text-align: left; border-bottom: 1px solid var(--border);
  }
  .totals-table th:last-child, .totals-table td:last-child { text-align: right; }
  .totals-table td { padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .totals-table tr:last-child td { border-bottom: none; }
  .tot-name { font-weight: 600; color: var(--text); }
  .tot-mins { font-weight: 800; font-size: 14px; color: var(--text); }
  .tot-gk {
    display: inline-block; font-size: 10px; padding: 2px 6px;
    border-radius: 999px; background: rgba(232,101,10,0.18);
    color: var(--orange-mid); font-weight: 700; margin-left: 5px;
    border: 1px solid rgba(232,101,10,0.3);
  }
  .bar-wrap {
    width: 80px; height: 5px; background: var(--border2); border-radius: 3px;
    overflow: hidden; display: inline-block; margin-right: 8px; vertical-align: middle;
  }
  .bar-fill { height: 100%; background: var(--orange); border-radius: 3px; }

  .top-actions { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
  .top-actions .game-info { flex: 1; font-size: 13px; color: var(--text-2); }
  .top-actions .game-info strong { color: var(--text); }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">⚽</div>
  <div>
    <h1>Maylett's Griffins</h1>
    <p>Coach Mitchell Maylett · Game Day Rotations</p>
  </div>
</div>

<!-- SCREEN 1: SELECT PLAYERS -->
<div class="screen active" id="screen-players">
  <div class="screen-heading">
    <p>Who's here today?</p>
    <p>Tap each player that showed up.</p>
  </div>
  <div class="card">
    <div class="select-all-row">
      <span id="selected-count">0 selected</span>
      <button class="link-btn" id="toggle-all-btn" onclick="toggleAll()">Select all</button>
    </div>
    <div class="player-grid" id="player-grid"></div>
  </div>
  <button class="btn-primary" id="btn-next-1" onclick="goToGoalie()" disabled>Continue →</button>
</div>

<!-- SCREEN 2: GOALIE + SHIFT LENGTH -->
<div class="screen" id="screen-goalie">
  <div class="screen-heading">
    <p>Set up the game</p>
    <p>Pick your goalies and how long each shift should run.</p>
  </div>

  <div class="card">
    <div class="card-title">Who's willing to play goalie?</div>
    <div class="goalie-grid" id="goalie-grid"></div>
  </div>

  <div class="card">
    <div class="card-title">Shift length</div>
    <div class="shift-selector" id="shift-selector"></div>
    <div class="shift-preview" id="shift-preview"></div>
  </div>

  <div style="display:flex;gap:8px;">
    <button class="btn-secondary" onclick="goTo('screen-players')">← Back</button>
    <button class="btn-primary" id="btn-generate" onclick="generateSchedule()" style="flex:1" disabled>Generate shifts</button>
  </div>
</div>

<!-- SCREEN 3: RESULTS -->
<div class="screen" id="screen-results">
  <div class="top-actions">
    <button class="btn-secondary" onclick="goTo('screen-goalie')">← Edit</button>
    <div class="game-info" id="game-info-label"></div>
  </div>
  <div class="summary-bar" id="summary-bar"></div>
  <div id="shifts-container"></div>
  <div class="card" style="margin-top:14px;">
    <div class="card-title">Playing time totals</div>
    <table class="totals-table" id="totals-table"></table>
  </div>
  <div style="padding-bottom:32px;"></div>
</div>

<script>
const ALL_PLAYERS = [
  { name: 'Benson' },
  { name: 'Milo' },
  { name: 'Zayn' },
  { name: 'Oliver' },
  { name: 'Jade' },
  { name: 'Watson' },
  { name: 'Leland' },
  { name: 'Sebastian' },
];
const OLIVER_IDX = 3;
const HALF_MIN = 15;
const SHIFT_OPTIONS = [2, 3, 4, 5, 6]; // minutes per shift

let selectedPlayers = new Set();
let goalieWilling = new Set();
let segMin = 3; // default

// ── PLAYER SELECT ──────────────────────────────────────────

function updateSelectedCount() {
  const n = selectedPlayers.size;
  document.getElementById('selected-count').textContent = n + ' selected';
  document.getElementById('toggle-all-btn').textContent =
    n === ALL_PLAYERS.length ? 'Deselect all' : 'Select all';
  document.getElementById('btn-next-1').disabled = n < 5;
}

function buildPlayerGrid() {
  const grid = document.getElementById('player-grid');
  grid.innerHTML = '';
  ALL_PLAYERS.forEach((p, i) => {
    const tile = document.createElement('div');
    tile.className = 'player-tile';
    tile.setAttribute('role', 'checkbox');
    tile.setAttribute('aria-checked', 'false');
    tile.innerHTML =
      '<div class="check-box"><div class="checkmark"></div></div>' +
      '<div class="player-name">' + p.name + '</div>' +
      (i === OLIVER_IDX ? '<span class="star-badge">⭐</span>' : '');

    function handleToggle(e) {
      e.preventDefault(); e.stopPropagation();
      if (selectedPlayers.has(i)) {
        selectedPlayers.delete(i); goalieWilling.delete(i);
        tile.classList.remove('selected'); tile.setAttribute('aria-checked','false');
      } else {
        selectedPlayers.add(i);
        tile.classList.add('selected'); tile.setAttribute('aria-checked','true');
      }
      updateSelectedCount();
    }
    tile.addEventListener('touchend', handleToggle, { passive: false });
    tile.addEventListener('click', handleToggle);
    grid.appendChild(tile);
  });
  updateSelectedCount();
}

function toggleAll() {
  const allSelected = selectedPlayers.size === ALL_PLAYERS.length;
  selectedPlayers.clear(); goalieWilling.clear();
  document.querySelectorAll('.player-tile').forEach((tile, i) => {
    if (!allSelected) {
      selectedPlayers.add(i);
      tile.classList.add('selected'); tile.setAttribute('aria-checked','true');
    } else {
      tile.classList.remove('selected'); tile.setAttribute('aria-checked','false');
    }
  });
  updateSelectedCount();
}

// ── GOALIE + SHIFT SETUP ───────────────────────────────────

function buildGoalieGrid() {
  const grid = document.getElementById('goalie-grid');
  grid.innerHTML = ''; goalieWilling.clear();
  [...selectedPlayers].sort((a,b) => a-b).forEach(idx => {
    const p = ALL_PLAYERS[idx];
    const btn = document.createElement('button');
    btn.className = 'goalie-btn'; btn.type = 'button';
    btn.textContent = p.name;
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      if (goalieWilling.has(idx)) { goalieWilling.delete(idx); btn.classList.remove('selected'); }
      else { goalieWilling.add(idx); btn.classList.add('selected'); }
      updateGenerateBtn();
    });
    grid.appendChild(btn);
  });
}

function buildShiftSelector() {
  const sel = document.getElementById('shift-selector');
  sel.innerHTML = '';
  SHIFT_OPTIONS.forEach(m => {
    const opt = document.createElement('div');
    opt.className = 'shift-opt' + (m === segMin ? ' selected' : '');
    opt.innerHTML =
      '<span class="shift-opt-min">' + m + '</span>' +
      '<span class="shift-opt-lbl">min</span>';
    function handlePick(e) {
      e.preventDefault();
      segMin = m;
      document.querySelectorAll('.shift-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      updateShiftPreview();
    }
    opt.addEventListener('touchend', handlePick, { passive: false });
    opt.addEventListener('click', handlePick);
    sel.appendChild(opt);
  });
  updateShiftPreview();
}

function updateShiftPreview() {
  const segsPerHalf = Math.floor(HALF_MIN / segMin);
  const total = segsPerHalf * 2;
  const n = selectedPlayers.size;
  // Each player's expected field time: total shifts * 5 on-field slots / n players * segMin
  const fieldSlots = total * 5;
  const avgShifts = Math.floor(fieldSlots / n);
  const minMins = avgShifts * segMin;
  const maxMins = Math.min((avgShifts + 1) * segMin, HALF_MIN * 2);
  const preview = document.getElementById('shift-preview');
  preview.innerHTML =
    '<strong>' + total + ' shifts</strong> per game (' + segsPerHalf + ' per half) · ' +
    'Each kid plays roughly <strong>' + minMins + '–' + maxMins + ' min</strong>';
}

function updateGenerateBtn() {
  document.getElementById('btn-generate').disabled = goalieWilling.size === 0;
}

function goToGoalie() {
  buildGoalieGrid();
  buildShiftSelector();
  goTo('screen-goalie');
}

// ── ROTATION ALGORITHM ─────────────────────────────────────

function generateSchedule() {
  const players = [...selectedPlayers].sort((a,b) => a-b);
  const goalies = [...goalieWilling];
  const segsPerHalf = Math.floor(HALF_MIN / segMin);
  const total = segsPerHalf * 2;
  const n = players.length;
  let fieldCnt = new Array(n).fill(0);
  let gkCnt = new Array(n).fill(0);
  const localIdx = idx => players.indexOf(idx);
  const segs = [];

  for (let s = 0; s < total; s++) {
    // Pick goalie: least stints, tiebreak by least field time
    let gkGlobal = goalies.reduce((best, g) => {
      const li = localIdx(g), lb = localIdx(best);
      if (gkCnt[li] < gkCnt[lb]) return g;
      if (gkCnt[li] === gkCnt[lb] && fieldCnt[li] < fieldCnt[lb]) return g;
      return best;
    }, goalies[0]);

    const gkLoc = localIdx(gkGlobal);
    gkCnt[gkLoc]++; fieldCnt[gkLoc]++;

    let rest = players
      .filter(p => p !== gkGlobal)
      .sort((a, b) => {
        const la = localIdx(a), lb2 = localIdx(b);
        return fieldCnt[la] - fieldCnt[lb2] || la - lb2;
      });

    // Shift 0 only: guarantee Oliver in starting 5 if playing
    if (s === 0 && players.includes(OLIVER_IDX) && gkGlobal !== OLIVER_IDX) {
      const oi = rest.indexOf(OLIVER_IDX);
      if (oi >= 4) { rest.splice(oi, 1); rest.unshift(OLIVER_IDX); }
    }

    const onField = rest.slice(0, 4);
    const bench = rest.slice(4);
    onField.forEach(p => fieldCnt[localIdx(p)]++);
    segs.push({ gk: gkGlobal, field: onField, bench, fc: [...fieldCnt], gc: [...gkCnt] });
  }

  renderResults(segs, players, segsPerHalf);
  goTo('screen-results');
}

// ── RENDER RESULTS ─────────────────────────────────────────

function renderResults(segs, players, segsPerHalf) {
  const goalieCount = [...goalieWilling].length;
  const totalMins = HALF_MIN * 2;

  document.getElementById('summary-bar').innerHTML =
    '<div class="sbar-item"><div class="sbar-val">' + segs.length + '</div><div class="sbar-lbl">Shifts</div></div>' +
    '<div class="sbar-item"><div class="sbar-val">' + segMin + 'm</div><div class="sbar-lbl">Per shift</div></div>' +
    '<div class="sbar-item"><div class="sbar-val">' + players.length + '</div><div class="sbar-lbl">Players</div></div>' +
    '<div class="sbar-item"><div class="sbar-val">' + goalieCount + '</div><div class="sbar-lbl">GK pool</div></div>';

  document.getElementById('game-info-label').innerHTML =
    '<strong>' + players.length + ' players</strong> · ' + segMin + ' min shifts · ' + totalMins + ' min game';

  const container = document.getElementById('shifts-container');
  container.innerHTML = '';

  const pillClass = idx => idx === OLIVER_IDX ? 'player-pill oliver-pill' : 'player-pill';

  segs.forEach((seg, i) => {
    if (i === segsPerHalf) {
      const bar = document.createElement('div');
      bar.className = 'halftime-bar';
      bar.innerHTML = '<span class="halftime-label">Halftime</span>';
      container.appendChild(bar);
    }

    const halfNum = i < segsPerHalf ? 1 : 2;
    const localI = i < segsPerHalf ? i : i - segsPerHalf;
    const startMin = localI * segMin;
    const endMin = Math.min(startMin + segMin, HALF_MIN);
    const gkP = ALL_PLAYERS[seg.gk];
    const gkPillClass = seg.gk === OLIVER_IDX ? 'player-pill gk-pill oliver-pill' : 'player-pill gk-pill';

    const fieldNames = seg.field.map(idx =>
      '<span class="' + pillClass(idx) + '">' + ALL_PLAYERS[idx].name + '</span>'
    ).join('');

    const benchHTML = seg.bench.length > 0
      ? seg.bench.map(idx => '<span class="' + pillClass(idx) + '">' + ALL_PLAYERS[idx].name + '</span>').join('')
      : '<span style="font-size:12px;color:var(--text-3)">—</span>';

    const card = document.createElement('div');
    card.className = 'shift-card';
    card.innerHTML =
      '<div class="shift-header">' +
        '<div class="shift-num">' + (i + 1) + '</div>' +
        '<div class="shift-meta">' +
          '<div class="shift-label">Shift ' + (i + 1) + '</div>' +
          '<div class="shift-time">' + (halfNum === 1 ? '1st' : '2nd') + ' half · min ' + startMin + '–' + endMin + '</div>' +
        '</div>' +
        '<span class="half-badge">' + (halfNum === 1 ? '1st' : '2nd') + '</span>' +
      '</div>' +
      '<div class="shift-body">' +
        '<div class="field-row"><span class="field-label">GK</span><span class="' + gkPillClass + '">' + gkP.name + '</span></div>' +
        '<div class="field-row"><span class="field-label">Field</span>' + fieldNames + '</div>' +
        (seg.bench.length > 0 ? '<div class="field-row"><span class="field-label" style="color:var(--text-3)">Bench</span>' + benchHTML + '</div>' : '') +
      '</div>';
    container.appendChild(card);
  });

  const lastSeg = segs[segs.length - 1];
  const maxFieldMins = Math.max(...lastSeg.fc) * segMin;
  const table = document.getElementById('totals-table');
  table.innerHTML =
    '<thead><tr><th>Player</th><th style="text-align:left">Progress</th><th>Mins</th></tr></thead>' +
    '<tbody id="totals-body"></tbody>';
  const tbody = table.querySelector('tbody');
  const localIdx = idx => players.indexOf(idx);

  const sorted = [...players].sort((a, b) => {
    if (a === OLIVER_IDX) return -1;
    if (b === OLIVER_IDX) return 1;
    return a - b;
  });

  sorted.forEach(idx => {
    const p = ALL_PLAYERS[idx];
    const li = localIdx(idx);
    const mins = lastSeg.fc[li] * segMin;
    const gkMins = lastSeg.gc[li] * segMin;
    const pct = maxFieldMins > 0 ? Math.round((mins / maxFieldMins) * 100) : 0;
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td><span class="tot-name">' + p.name + (idx === OLIVER_IDX ? ' ⭐' : '') + '</span>' +
        (gkMins > 0 ? '<span class="tot-gk">GK ' + gkMins + 'm</span>' : '') + '</td>' +
      '<td><span class="bar-wrap"><span class="bar-fill" style="width:' + pct + '%"></span></span></td>' +
      '<td><span class="tot-mins">' + mins + 'm</span></td>';
    tbody.appendChild(tr);
  });
}

function goTo(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  window.scrollTo(0, 0);
}

buildPlayerGrid();
</script>
</body>
</html>
